<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b3a8f">
<meta name="mobile-web-app-capable" content="yes">
<title>Zentek Commande</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2320;--mute:#66706a;--red:#c8201a;--green:#1f7a3d;--line:#dfe3dc;--wa:#128c4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2420;--ink:#eef2ee;--mute:#9aa69e;--line:#333c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:110px}
header{background:#fff;color:#1d2320;padding:14px 16px 12px;border-bottom:4px solid #1b3a8f}
header img{height:80px;width:auto;display:block}
header p{margin:8px 0 10px;font-size:13px;color:#4a5560;line-height:1.35}
#q{width:100%;padding:11px 14px;border:1.5px solid #1b3a8f;border-radius:999px;font:inherit;color:#1d2320;background:#fff}
main{max-width:720px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:#fff}
.name{font-weight:600;font-size:14px;min-height:36px}
.price{color:var(--ink);font-weight:700;font-size:16px}
.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:auto}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:20px}
.qty button.minus{background:var(--line);color:var(--ink)}
.qty span{min-width:28px;text-align:center;font-weight:700}
.info{margin:18px 0 8px;display:grid;gap:8px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.tot{font-size:13px;color:var(--mute)}
.tot b{display:block;font-size:19px;color:var(--ink)}
.send{background:var(--wa);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;flex:1;max-width:320px}
.send:disabled{opacity:.45}
.msg{color:var(--red);font-size:13px;min-height:18px}
.hide{display:none}
.origin{font-size:12px;color:var(--mute)}
.out img{opacity:.4}
.badge{background:#fde8e7;color:#b3261e;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;align-self:flex-start}
.toast{position:fixed;left:14px;right:14px;bottom:84px;background:#b3261e;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;display:none;z-index:5}
</style>
</head>

var OUT = ["Aérosol 250ml"]; // produits en rupture de stock
var toastT;
function originHtml(n){
  var o = /iffuseur/.test(n) || /^(Gel |Zentek gel)/.test(n) ? "Corée du Sud" : /^Aérosol/.test(n) ? "Espagne" : (/^Zentek liquide/.test(n) || /^Bengal/.test(n)) ? "Italie" : /^Zentek total/.test(n) ? "Allemagne" : "Italie";
  return o ? '<div class="origin">Origine : '+o+'</div>' : '';
}
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(function(){t.style.display="none"},3000); }
var ADMIN_PIN = "5971"; // code secret pour modifier les prix
try{ var ov = JSON.parse(localStorage.getItem("zentek_prices")||"{}"); PRODUCTS.forEach(function(p){ if(typeof ov[p.name]==="number") p.price = ov[p.name]; }); }catch(e){}
var qty = PRODUCTS.map(function(){return 0});
var grid = document.getElementById("grid"), cards = [];
function fmt(n){return n.toFixed(2)}
PRODUCTS.forEach(function(p,i){
  var d = document.createElement("div"); d.className="card"+(OUT.indexOf(p.name)>=0?" out":"");
  d.innerHTML = '<img alt="" src="'+p.img+'"><div class="name">'+p.name+'</div><div class="price">'+fmt(p.price)+' DH</div>'+originHtml(p.name)+(OUT.indexOf(p.name)>=0?'<div class="badge">Rupture de stock</div>':'')+
    '<div class="qty"><button class="minus" aria-label="Moins">−</button><span>0</span><button aria-label="Plus">+</button></div>';
  var b = d.querySelectorAll("button");
  b[0].onclick = function(){ if(qty[i]>0){qty[i]--; update();} };
  b[1].onclick = function(){ if(OUT.indexOf(p.name)>=0){ toast("Rupture de stock : « "+p.name+" » n’est pas disponible actuellement."); return; } qty[i]++; update(); };
  grid.appendChild(d); cards.push(d);
});
function update(){
  var t=0,n=0;
  qty.forEach(function(q,i){ t+=q*PRODUCTS[i].price; n+=q; cards[i].querySelector("span").textContent=q; });
  document.getElementById("total").textContent = fmt(t)+" DH";
  document.getElementById("send").disabled = n===0;
}
document.getElementById("q").oninput = function(){
  var s = this.value.toLowerCase().trim();
  PRODUCTS.forEach(function(p,i){ cards[i].classList.toggle("hide", s && p.name.toLowerCase().indexOf(s)<0); });
};
document.getElementById("send").onclick = function(){
  var client = document.getElementById("client").value.trim();
  document.getElementById("msg").textContent = "";
  var lines = ["*Nouvelle commande Zentek*"];
  if(client) lines.push("Client : "+client);
  var sect = document.getElementById("sector").value.trim();
  if(sect) lines.push("Secteur : "+sect);
  lines.push("");
  var total=0;
  qty.forEach(function(q,i){ if(q>0){ var s=q*PRODUCTS[i].price; total+=s; lines.push("• "+PRODUCTS[i].name+" × "+q+" = "+fmt(s)+" DH"); } });
  lines.push("","*Total : "+fmt(total)+" DH*");
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(lines.join("\n")),"_blank");
};
var adminOn=false, taps=0, tapT;
function savePrices(){ try{ var o={}; PRODUCTS.forEach(function(p){o[p.name]=p.price}); localStorage.setItem("zentek_prices",JSON.stringify(o)); }catch(e){} }
function refreshPrices(){
  cards.forEach(function(c,i){
    var el=c.querySelector(".price"), p=PRODUCTS[i];
    if(adminOn){
      el.innerHTML='<input type="number" inputmode="decimal" step="0.01" min="0" value="'+p.price+'" style="width:90px;padding:6px"> DH';
      el.querySelector("input").oninput=function(){ var v=parseFloat(this.value); if(!isNaN(v)){ p.price=v; savePrices(); update(); } };
    } else { el.textContent=fmt(p.price)+" DH"; }
  });
}
function showAdminBar(){
  var bar=document.getElementById("adm"); bar.style.display="block";
  bar.innerHTML='Mode admin : prix modifiables sur cet appareil. <button id="rs">Réinitialiser</button> <button id="qt">Quitter</button>';
  document.getElementById("qt").onclick=function(){ adminOn=false; bar.style.display="none"; refreshPrices(); };
  document.getElementById("rs").onclick=function(){ try{localStorage.removeItem("zentek_prices");}catch(e){} location.reload(); };
}
function askPin(){
  var bar=document.getElementById("adm"); bar.style.display="block";
  bar.innerHTML='<input id="pin" type="password" inputmode="numeric" placeholder="Code admin" style="width:140px;padding:8px"> <button id="pinok">OK</button>';
  document.getElementById("pinok").onclick=function(){
    if(document.getElementById("pin").value===ADMIN_PIN){ adminOn=true; showAdminBar(); refreshPrices(); }
    else { bar.textContent="Code incorrect."; setTimeout(function(){ bar.style.display="none"; },1500); }
  };
}
document.querySelector("header img").onclick=function(){
  taps++; clearTimeout(tapT); tapT=setTimeout(function(){taps=0},2000);
  if(taps>=5){ taps=0; if(adminOn){ adminOn=false; document.getElementById("adm").style.display="none"; refreshPrices(); } else askPin(); }
};
</script>
